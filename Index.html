<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Chit Book — customer &amp; collection ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#20264A;
  --plum-soft:#333B6B;
  --paper:#F6F5F0;
  --paper-2:#ECE7DA;
  --skin:#D8C48A;
  --line:#DEDACB;
  --due:#B23A2E;
  --paid:#2E7D4F;
  --gold:#E0A72E;
  --ink:#1E1B14;
  --ink-2:#6E6555;
  --card:#FFFFFF;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plum:#151933; --plum-soft:#252C55;
    --paper:#12110D; --paper-2:#1B1913; --card:#191712;
    --line:#2E2B22; --skin:#C7AF74;
    --ink:#EFEAE0; --ink-2:#9A9182;
    --due:#F08A72; --paid:#7BCB98; --gold:#E0A72E;
  }
}
:root[data-theme="dark"]{
  --plum:#151933; --plum-soft:#252C55;
  --paper:#12110D; --paper-2:#1B1913; --card:#191712;
  --line:#2E2B22; --skin:#C7AF74;
  --ink:#EFEAE0; --ink-2:#9A9182;
  --due:#F08A72; --paid:#7BCB98; --gold:#E0A72E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Instrument Sans","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column}
.top{background:var(--plum);color:#F3EFE3;padding:14px 18px 16px;position:sticky;top:0;z-index:20}
.top .brand{display:flex;align-items:center;gap:11px}
.mono{width:38px;height:38px;border-radius:11px;background:var(--gold);color:var(--plum);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;flex:0 0 auto}
.mono.big{width:64px;height:64px;font-size:26px;border-radius:16px}
.top h1{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:700;margin:0;letter-spacing:-0.02em}
.top .sub{color:var(--skin);font-size:12.5px;margin-top:1px}
.iconbtn{background:rgba(255,255,255,.1);border:0;color:#F3EFE3;width:34px;height:34px;border-radius:10px;font-size:15px;display:grid;place-items:center}
main{flex:1;padding:14px 14px 96px}
section[hidden]{display:none}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:9px 2px 11px;color:var(--ink-2);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button b{font-size:17px;font-weight:400;line-height:1}
nav button[aria-current="true"]{color:var(--paid);font-weight:600}
nav button[aria-current="true"] b{transform:translateY(-1px)}

/* hero */
.hero{background:var(--plum);color:#F3EFE3;border-radius:16px;padding:18px 18px 16px;margin-bottom:14px}
.hero .cap{color:var(--skin);font-size:13px}
.hero .big{font-size:40px;font-weight:800;line-height:1.05;margin:4px 0 2px}
.hero .meta{color:var(--skin);font-size:12.5px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.split div{background:rgba(255,255,255,.08);border-radius:10px;padding:9px 11px}
.split span{display:block;color:var(--skin);font-size:12px}
.split strong{font-size:19px;font-weight:700}

/* generic */
h2{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:700;margin:20px 0 8px;letter-spacing:-0.01em}
h2:first-child{margin-top:4px}
.muted{color:var(--ink-2);font-size:13px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.row:last-child{border-bottom:0}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who span{display:block;color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;font-size:16px;white-space:nowrap}
.amt.due{color:var(--due)} .amt.paid{color:var(--paid)} .amt.zero{color:var(--ink-2)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.pill.hot{color:var(--due);border-color:var(--due)}
.pill.ok{color:var(--paid);border-color:var(--paid)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--ink-2);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:600}

/* forms */
label{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px}
textarea{resize:vertical}
input[type=number]{font-family:"Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--plum);color:#F3EFE3;border-color:var(--plum)}
.total{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;display:flex;justify-content:space-between;align-items:baseline}
.total span{font-size:13px;color:var(--ink-2)}
.total b{font-size:26px;font-weight:800}
.go{width:100%;margin-top:14px;background:var(--gold);color:#1E1B14;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;text-decoration:none;display:block;text-align:center}
.go.green{background:var(--paid);color:#fff}
.go.ghost{background:none;color:var(--ink-2);border:1px solid var(--line);font-weight:500;padding:11px}
.warn{margin-top:10px;border-left:3px solid var(--gold);background:var(--paper-2);padding:9px 12px;border-radius:0 10px 10px 0;font-size:13px}
.search{margin-bottom:10px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,12,5,.55);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-radius:20px 20px 0 0;
  max-width:520px;margin:0 auto;max-height:90vh;overflow:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));display:none}
.sheet.on{display:block}
.grab{width:38px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 10px}
.sheet h3{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;margin:0 0 2px;letter-spacing:-0.02em}
.ledger{margin-top:12px;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.lrow .d{font-size:11.5px;color:var(--ink-2)}
.lrow .t{font-size:13.5px}
.lrow .t em{font-style:normal;color:var(--ink-2);font-size:12px;display:block}
.lrow .v{text-align:right;font-weight:600;font-size:14px}
.lrow .v small{display:block;font-weight:400;color:var(--ink-2);font-size:11.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--plum);color:#F3EFE3;
  padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
.tablines{width:100%;border-collapse:collapse;font-size:13.5px}
.tablines th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.tablines td{padding:7px 0;border-bottom:1px solid var(--line)}
.tablines td:last-child,.tablines th:last-child{text-align:right}
.link{color:var(--plum-soft);text-decoration:none;font-weight:600}
:root[data-theme="dark"] .link, @media (prefers-color-scheme:dark){.link{color:var(--skin)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mono" id="bizMono">D</div>
      <div style="flex:1;min-width:0">
        <h1 id="bizName">Daily Chit Book</h1>
        <div class="sub" id="bizSub">Customer &amp; daily collection ledger</div>
      </div>
      <button class="iconbtn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </header>

  <main>
    <section id="s-today"></section>
    <section id="s-collect" hidden></section>
    <section id="s-purchase" hidden></section>
    <section id="s-customers" hidden></section>
    <section id="s-books" hidden></section>
  </main>

  <nav>
    <button data-tab="today" aria-current="true"><b>▦</b>Today</button>
    <button data-tab="collect"><b>₹</b>Collect</button>
    <button data-tab="purchase"><b>◉</b>New chit</button>
    <button data-tab="customers"><b>☷</b>Customers</button>
    <button data-tab="books"><b>▤</b>Books</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const el = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = s => String(s==null?'':s).replace(/[^0-9+]/g,'');
const money = n => '₹' + Math.round(Number(n)||0).toLocaleString('en-IN');
const today = () => new Date().toISOString().slice(0,10);
const dmy = d => { if(!d) return ''; const [y,m,dd]=d.split('-'); return dd+'/'+m; };
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1900); }

/* ---------- state ---------- */
const S = {
  tab:'today',
  customers:[],          // {id,name,phone,address,shop,item,daily,opening,createdAt,active}
  ledger:{},             // docId -> {cid, month, entries:[...]}
  settings:{biz:'Daily Chit Book', line:'Customer & daily collection ledger'},
  mode:'local'
};

/* ---------- storage: this browser only ---------- */
const Store = {
  init(onReady){ this.load(); onReady(); },
  load(){
    try{
      const raw = localStorage.getItem('chitledger_v1');
      if(raw){ const d = JSON.parse(raw); S.customers=d.customers||[]; S.ledger=d.ledger||{}; S.settings=Object.assign(S.settings,d.settings||{}); }
    }catch(e){}
  },
  persist(){
    try{ localStorage.setItem('chitledger_v1', JSON.stringify({customers:S.customers, ledger:S.ledger, settings:S.settings})); }
    catch(e){ toast('Could not save on this device'); }
  }
};

/* ---------- ledger maths ---------- */
function docIdFor(cid, date){ return cid + '-' + date.slice(0,7).replace('-',''); }
function entriesOf(cid){
  const out=[];
  Object.keys(S.ledger).forEach(k=>{ const d=S.ledger[k]; if(d && d.cid===cid && Array.isArray(d.entries)) out.push(...d.entries); });
  return out.sort((a,b)=> (a.date===b.date ? (a.ts||0)-(b.ts||0) : a.date.localeCompare(b.date)));
}
function allEntries(){
  const out=[];
  Object.keys(S.ledger).forEach(k=>{ const d=S.ledger[k]; if(d&&Array.isArray(d.entries)) d.entries.forEach(e=>out.push(Object.assign({cid:d.cid},e))); });
  return out.sort((a,b)=> (a.date===b.date ? (b.ts||0)-(a.ts||0) : b.date.localeCompare(a.date)));
}
// a purchase (chit given) adds to what the customer owes; payment & discount reduce it
function signed(e){ return e.type==='purchase' ? Number(e.amount)||0 : -(Number(e.amount)||0); }
function balanceOf(cid){
  const c = S.customers.find(x=>x.id===cid);
  let b = c ? (Number(c.opening)||0) : 0;
  entriesOf(cid).forEach(e=> b += signed(e));
  return b;
}
function lastPaidDate(cid){
  const p = entriesOf(cid).filter(e=>e.type==='payment');
  return p.length ? p[p.length-1].date : null;
}
function paidStreak(cid){
  // consecutive calendar days up to today that have a payment
  const dates = new Set(entriesOf(cid).filter(e=>e.type==='payment').map(e=>e.date));
  let n=0, d=today();
  while(dates.has(d)){ n++; const x=new Date(d); x.setDate(x.getDate()-1); d=x.toISOString().slice(0,10); }
  return n;
}
function totalOutstanding(){ return S.customers.reduce((s,c)=> s + balanceOf(c.id), 0); }
function dayTotals(date){
  let given=0, pay=0;
  allEntries().forEach(e=>{ if(e.date!==date) return;
    if(e.type==='purchase'){ given+=Number(e.amount)||0; }
    else if(e.type==='payment'){ pay+=Number(e.amount)||0; } });
  return {given,pay};
}
function custName(cid){ const c=S.customers.find(x=>x.id===cid); return c? c.name : 'Deleted customer'; }

/* ---------- writes ---------- */
function addEntry(cid, entry){
  entry.id = entry.id || uid('e');
  entry.ts = Date.now();
  const did = docIdFor(cid, entry.date);
  const doc = S.ledger[did] ? JSON.parse(JSON.stringify(S.ledger[did])) : {cid, month:entry.date.slice(0,7), entries:[]};
  doc.entries.push(entry);
  S.ledger[did]=doc;
  render();
  Store.persist();
}
function removeEntry(cid, entryId, date){
  const did = docIdFor(cid, date);
  const doc = S.ledger[did]; if(!doc) return;
  const nd = {cid:doc.cid, month:doc.month, entries: doc.entries.filter(e=>e.id!==entryId)};
  S.ledger[did]=nd; render();
  Store.persist();
}
function upsertCustomer(c){
  const i = S.customers.findIndex(x=>x.id===c.id);
  if(i>=0) S.customers[i]=c; else S.customers.push(c);
  render();
  Store.persist();
}

/* ---------- sheet ---------- */
function openSheet(html){ $('#sheetBody').innerHTML=''; $('#sheetBody').appendChild(el(html)); $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').addEventListener('click', closeSheet);

/* ================= SCREENS ================= */

function viewToday(){
  const out = totalOutstanding();
  const t = dayTotals(today());
  const dues = S.customers.map(c=>({c, b:balanceOf(c.id)})).filter(x=>x.b>0.5).sort((a,b)=>b.b-a.b);
  const overdue = dues.filter(x=>{ const lp=lastPaidDate(x.c.id); return !lp || daysBetween(lp, today())>=2; });
  const recent = allEntries().slice(0,8);

  let h = `<div>
    <div class="hero">
      <div class="cap">Total out on the street</div>
      <div class="big num">${money(out)}</div>
      <div class="meta">${dues.length} customer${dues.length===1?'':'s'} carrying a balance${overdue.length?` · ${overdue.length} missed a day or more`:''}</div>
      <div class="split">
        <div><span>Given out today</span><strong class="num">${money(t.given)}</strong></div>
        <div><span>Collected today</span><strong class="num">${money(t.pay)}</strong></div>
      </div>
    </div>`;

  if(!S.customers.length){
    h += `<div class="empty"><div class="mono big" style="margin:0 auto 10px">${esc((S.settings.biz||'D')[0])}</div><b>Start with your customers</b>Add the shops and customers you've given goods or money to, then record each daily collection against them.
      <button class="go" data-act="tab" data-v="customers" style="margin-top:14px">Add first customer</button>
      <button class="go ghost" data-act="demo">Load sample customers to explore</button></div>`;
  } else {
    h += `<h2>Chase these first</h2>`;
    const list = (overdue.length?overdue:dues).slice(0,5);
    h += `<div class="rows">` + list.map(x=>{
      const lp=lastPaidDate(x.c.id);
      const gap = lp? daysBetween(lp,today()) : null;
      return `<button class="row" data-act="cust" data-v="${x.c.id}">
        <div class="who"><b>${esc(x.c.name)}</b><span>${esc(x.c.shop||'')}${gap!=null?` · paid ${gap===0?'today':gap+'d ago'}`:' · never paid'}</span></div>
        <div class="amt due num">${money(x.b)}</div></button>`;
    }).join('') + `</div>`;

    h += `<h2>Recent entries</h2>`;
    h += recent.length ? `<div class="rows">` + recent.map(e=>`
      <button class="row" data-act="cust" data-v="${e.cid}">
        <div class="who"><b>${esc(custName(e.cid))}</b><span>${dmy(e.date)} · ${e.type==='purchase'?('chit given · '+esc(e.item||'')):(e.type==='payment'?'daily collection':esc(e.note||'adjustment'))}</span></div>
        <div class="amt num ${e.type==='purchase'?'due':(e.type==='payment'?'paid':'zero')}">${e.type==='purchase'?'+':'−'}${money(e.amount)}</div>
      </button>`).join('') + `</div>` : `<div class="empty">Nothing recorded yet today.</div>`;
  }
  h += `</div>`;
  return h;
}

function viewCollect(){
  const q = (S._cq||'').toLowerCase();
  let dues = S.customers.map(c=>({c,b:balanceOf(c.id)})).filter(x=>x.b>0.5);
  if(q) dues = dues.filter(x=> (x.c.name+' '+(x.c.shop||'')+' '+(x.c.phone||'')+' '+(x.c.address||'')).toLowerCase().includes(q));
  dues.sort((a,b)=>b.b-a.b);
  const t = dayTotals(today());
  const paidToday = new Set(allEntries().filter(e=>e.date===today()&&e.type==='payment').map(e=>e.cid));

  let h = `<div>
    <div class="hero" style="padding:14px 16px">
      <div class="cap">Collected today</div>
      <div class="big num" style="font-size:32px">${money(t.pay)}</div>
      <div class="meta">${paidToday.size} of ${dues.length + paidToday.size} customers covered</div>
    </div>
    <input class="search" id="cq" placeholder="Search name, shop or phone" value="${esc(S._cq||'')}">`;

  if(!dues.length){
    h += `<div class="empty"><b>Nothing pending</b>Every customer is settled, or you haven't given out any chits yet.</div>`;
  } else {
    h += `<div class="rows">` + dues.map(x=>{
      const lp = lastPaidDate(x.c.id);
      const gap = lp? daysBetween(lp,today()) : null;
      const hot = gap===null || gap>=2;
      const streak = paidStreak(x.c.id);
      return `<button class="row" data-act="pay" data-v="${x.c.id}">
        <div class="who"><b>${esc(x.c.name)}</b><span>${esc(x.c.shop||'—')} ${paidToday.has(x.c.id)?'· <span class="pill ok">paid today</span>':(hot?'· <span class="pill hot">'+(gap===null?'never paid':gap+' days')+'</span>':(streak>1?'· <span class="pill ok">'+streak+'-day streak</span>':''))}</span></div>
        <div class="amt due num">${money(x.b)}</div></button>`;
    }).join('') + `</div>
    <p class="muted" style="margin-top:10px">Tap a customer to enter what you collected today. Part payments are fine — the balance carries forward.</p>`;
  }
  return h + `</div>`;
}

function viewPurchase(){
  const d = S._pur || (S._pur = {cid:'', date:today(), amount:'', item:'', daily:''});
  const cust = S.customers.find(c=>c.id===d.cid);
  const bal = cust? balanceOf(cust.id) : 0;
  const amount = Number(d.amount)||0;

  return `<div>
    <h2>Give a new chit / credit</h2>
    ${!S.customers.length?`<div class="empty"><b>No customers yet</b>Add a customer first, then you can give them goods or money on daily-collection terms.
      <button class="go" data-act="tab" data-v="customers" style="margin-top:12px">Go to customers</button></div>`:`
    <label for="f-cid">Customer</label>
    <select id="f-cid" data-f="cid">
      <option value="">Choose a customer</option>

function viewBooks(){
  const r = S._range || (S._range = {from: today().slice(0,8)+'01', to: today()});
  const ent = allEntries().filter(e=> e.date>=r.from && e.date<=r.to);
  const given = ent.filter(e=>e.type==='purchase').reduce((s,e)=>s+(+e.amount||0),0);
  const pay = ent.filter(e=>e.type==='payment').reduce((s,e)=>s+(+e.amount||0),0);

  const byDay={};
  ent.forEach(e=>{ byDay[e.date]=byDay[e.date]||{given:0,pay:0};
    if(e.type==='purchase') byDay[e.date].given += (+e.amount||0);

  return `<div>

      ${days.map(d=>`<tr><td>${dmy(d)}</td><td class="num">${money(byDay[d].given)}</td><td class="num">${money(byDay[d].pay)}</td></tr>`).join('')}

function csvEscape(v){ v=String(v==null?'':v); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function offerCSV(filename, rows){
  const text = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  openSheet(`<div><h3>${esc(filename)}</h3><div class="muted">Copy this into a spreadsheet or message it to yourself.</div>

    <button class="go" id="cp">Copy to clipboard</button></div>`);
  $('#cp').addEventListener('click', ()=>{
    const ta=$('#sheetBody textarea'); ta.select();
    try{ navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand('copy'); }
    toast('Copied');
  });
}

function loadDemo(){
  let s = 20260918;
  const rnd = () => (s = (s*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const pick = (a,b) => a + Math.floor(rnd()*(b-a+1));
  const DAYS = 24;
  const base = new Date(); base.setHours(12,0,0,0);
  const dayStr = n => { const x=new Date(base); x.setDate(x.getDate()-n); return x.toISOString().slice(0,10); };

  const made = [], ledger = {};
  let tick = Date.now() - 1e7;
  const push = (cid, e) => {
    e.id = uid('e'); e.ts = tick++;
    const did = docIdFor(cid, e.date);
    (ledger[did] = ledger[did] || {cid, month:e.date.slice(0,7), entries:[]}).entries.push(e);
  };

  DEMO.forEach(p => {
    const c = {id:uid('c'), name:p.name, shop:p.shop, address:p.address, phone:p.phone, item:p.item,
               daily:p.daily, opening:p.opening, createdAt:dayStr(DAYS+10), active:true};
    made.push(c);
    let bal = p.opening;
    let dailyDue = p.daily>0 ? p.daily : Math.round((p.amt[0]+p.amt[1])/2/20/10)*10;

    for (let n = DAYS-1; n >= 0; n--) {
      const date = dayStr(n);

      const give = (n % p.every === 0) && rnd() < 0.9;
      if (give && n > 0) {
        const amount = pick(p.amt[0], p.amt[1]);
        push(c.id, {type:'purchase', date, amount, item:p.item});
        bal += amount;
      }

      const willPay = rnd() < p.payRate;
      if (willPay && bal > 0 && p.style!=='lumpy') {
        const amt = Math.min(bal, dailyDue * (0.7 + rnd()*0.6));
        const rounded = Math.max(10, Math.round(amt/10)*10);
        if (rounded > 0) { push(c.id, {type:'payment', date, amount:rounded, note:''}); bal -= rounded; }
      } else if (p.style==='lumpy' && rnd() < 0.15 && bal>500) {
        const amt = Math.min(bal, pick(500,2500));
        push(c.id, {type:'payment', date, amount:amt, note:''}); bal -= amt;
      }
    }
  });

  S.customers = S.customers.concat(made);
  Object.assign(S.ledger, ledger);
  closeSheet(); render();
  Store.persist();
  toast('10 customers · ' + Object.keys(ledger).reduce((n,k)=>n+ledger[k].entries.length,0) + ' entries loaded');
}

document.addEventListener('click', (ev)=>{
  const t = ev.target.closest('[data-act]'); if(!t) return;
  const v = t.dataset.v;
  switch(t.dataset.act){
    case 'tab': S.tab=v; render(); break;
    case 'cust': sheetCustomer(v); break;
    case 'pay': sheetPayment(v); break;
    case 'adjust': sheetAdjust(v); break;
    case 'newCust': sheetCustomerForm(null); break;
    case 'editCust': sheetCustomerForm(v); break;
    case 'demo': t.disabled=true; t.textContent='Loading…'; loadDemo(); break;
    case 'purFor': closeSheet(); S._pur=Object.assign(S._pur||{},{cid:v,date:today(),amount:'',item:'',daily:''}); S.tab='purchase'; render(); break;
    case 'copyStmt': {
      const txt=statementText(v);
      navigator.clipboard.writeText(txt).then(()=>toast('Statement copied')).catch(()=>{
        openSheet(`<div><h3>Statement</h3><textarea rows="12" style="margin-top:10px">${esc(txt)}</textarea></div>`);
      });
      break;
    }
    case 'undoLast': {
      const e = entriesOf(v).slice(-1)[0]; if(!e) break;
      if(confirm('Delete the latest entry for this customer?')){ closeSheet(); removeEntry(v,e.id,e.date); toast('Entry deleted'); }
      break;
    }
    case 'savePurchase': {
      const d=S._pur;
      const amount = Number(d.amount)||0;
      if(!d.cid || !amount){ toast('Pick a customer and an amount'); break; }
      addEntry(d.cid,{type:'purchase',date:d.date,amount,item:d.item});
      if(Number(d.daily)>0){
        const c=S.customers.find(x=>x.id===d.cid);
        if(c){ c.daily=Number(d.daily); upsertCustomer(c); }
      }
      const nm=custName(d.cid);
      S._pur={cid:'',date:today(),amount:'',item:'',daily:''};
      render(); toast(money(amount)+' chit given to '+nm);
      break;
    }
    case 'csv': {
      const r=S._range;
      const rows=[['Date','Customer','Type','Amount','Item / Note']];
      allEntries().filter(e=>e.date>=r.from&&e.date<=r.to).reverse().forEach(e=>
        rows.push([e.date,custName(e.cid),e.type,e.amount,e.item||e.note||'']));
      offerCSV('daybook-'+r.from+'-to-'+r.to+'.csv', rows); break;
    }
    case 'csvDues': {
      const rows=[['Customer','Shop','Phone','Address','Last paid','Balance']];
      S.customers.map(c=>({c,b:balanceOf(c.id)})).sort((a,b)=>b.b-a.b).forEach(x=>
        rows.push([x.c.name,x.c.shop||'',x.c.phone||'',x.c.address||'',lastPaidDate(x.c.id)||'',Math.round(x.b)]));
      offerCSV('outstanding-'+today()+'.csv', rows); break;
    }
  }
});

// live form binding for the purchase screen / range / search
document.addEventListener('input', (ev)=>{
  const f=ev.target.dataset.f, r=ev.target.dataset.r;
  if(f){ S._pur[f]=ev.target.value;
    if(f==='cid'||f==='amount'){ const p=window.scrollY; render(); window.scrollTo(0,p); }
    return; }
  if(r){ S._range[r]=ev.target.value; const p=window.scrollY; render(); window.scrollTo(0,p); return; }
  if(ev.target.id==='cq'){ S._cq=ev.target.value; const p=window.scrollY; render(); window.scrollTo(0,p); $('#cq')&&$('#cq').focus(); return; }
  if(ev.target.id==='kq'){ S._kq=ev.target.value; const p=window.scrollY; render(); window.scrollTo(0,p); $('#kq')&&$('#kq').focus(); return; }
});

/* ---------- boot ---------- */
render();
Store.init(()=>{
  if(!S.customers.length && !localStorage.getItem('chitledger_v1')){ loadDemo(); }
  render();
});
})();
</script>
